name: Java CI

on:
  push:
    branches:
      - main
      - work/compat-1.19-1.21-pt-br
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'build-tools/**'
      - 'pom.xml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'build-tools/**'
      - 'pom.xml'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Testes e compilação Maven
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Executar testes e empacotar
        run: mvn --batch-mode --no-transfer-progress clean verify --file pom.xml

      - name: Publicar relatórios de teste mesmo em caso de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-maven-surefire
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
