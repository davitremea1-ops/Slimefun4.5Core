# Nome e versão
name: Slimefun
version: ${project.version}

# Metadados do projeto
author: Comunidade Slimefun 4
website: https://github.com/Slimefun
description: O Slimefun transforma seu servidor em uma experiência semelhante a um modpack, sem exigir que os jogadores instalem mods

# Configurações técnicas
main: io.github.thebusybiscuit.slimefun4.implementation.Slimefun
api-version: '1.19'

# Dependências opcionais do Slimefun.
softdepend:
- PlaceholderAPI
- WorldEdit
- ClearLag
- mcMMO
- ItemsAdder
- Orebfuscator

# Comandos
commands:
  slimefun:
    aliases: sf
    description: Comando principal do Slimefun
    usage: A versão do Slimefun instalada não parece ser compatível com a configuração do servidor. Consulte o console para obter mais detalhes.
  addon:
    description: Administração de add-ons gerenciados pelo Slimefun
    usage: /addon <list|download|update|remove|enable|disable> [nome]

# Permissões padrão
permissions:
  slimefun.command.guide:
    description: Permite obter o livro-guia do Slimefun
    default: true
  slimefun.command.search:
    description: Permite usar o comando /sf search
    default: true
  slimefun.command.open_guide:
    description: Permite abrir o guia do Slimefun sem ter o livro
    default: op
  slimefun.cheat.items:
    description: Permite conceder itens do Slimefun por comando
    default: op
  slimefun.cheat.researches:
    description: Permite desbloquear pesquisas por comando
    default: op
  slimefun.stats.others:
    description: Permite consultar as estatísticas de outros jogadores
    default: op
  slimefun.android.upload-script:
    description: Permite enviar scripts para Androids
    default: op
  slimefun.command.timings:
    description: Permite usar o comando /sf timings
    default: op
  slimefun.command.teleporter:
    description: Permite usar o comando /sf teleporter
    default: op
  slimefun.command.versions:
    description: Permite usar o comando /sf versions
    default: op
  slimefun.command.update:
    description: Permite usar o comando /sf update
    default: op
  slimefun.command.backpack:
    description: Permite usar o comando /sf backpack
    default: op
  slimefun.command.charge:
    description: Permite usar o comando /sf charge
    default: op
  slimefun.command.debug:
    description: Permite usar o comando /sf debug
    default: op
  slimefun.android.bypass:
    description: Permite editar os Androids de outros jogadores
    default: op
  slimefun.cargo.bypass:
    description: Permite editar os blocos de transporte de itens de outros jogadores
    default: op
  slimefun.inventory.bypass:
    description: Permite abrir todas as máquinas do Slimefun
    default: op
  slimefun.gps.bypass:
    description: Permite abrir todos os inventários de GPS
    default: op
  slimefun.debugging:
    description: Permite usar a ferramenta de depuração do Slimefun
    default: op
  addon.admin:
    description: Permite administrar completamente os add-ons gerenciados
    default: op
  addon.update:
    description: Permite baixar e atualizar add-ons gerenciados
    default: op
  addon.manage:
    description: Permite ativar, desativar e remover add-ons gerenciados
    default: op
